services:
  - type: web
    name: pepino-api
    runtime: docker
    rootDir: Back/GameServer/GameServer
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PEPINO_FRONTEND_ORIGINS
        sync: false

  - type: web
    name: pepino-web
    runtime: static
    rootDir: Front/game-client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GAME_HUB_URL
        sync: false
